# FMT System Configuration File

# The target should match with BSP's target name
target = "RedStoneeTek-CH32_FMU"

[console]
    [[console.devices]]
    auto-switch = true
    baudrate    = 115200
    name        = "serial0"
    type        = "serial"

    [[console.devices]]
    auto-switch = true
    name        = "mav_console"
    type        = "mavlink"

[pilot-cmd]
stick-channel = [4, 3, 1, 2]
    [pilot-cmd.device]
    channel-num = 8
    name        = "rc"
    protocol    = "sbus"
    range       = [1000, 2000]
    sample-time = 0.05
    type        = "rc"

    [[pilot-cmd.mode]]
    channel = 5
    mode    = 5            # Position mode
    range   = [1000, 1300]

    [[pilot-cmd.mode]]
    channel = 5
    mode    = 4            # Altitude mode
    range   = [1400, 1600]

    [[pilot-cmd.mode]]
    channel = 5
    mode    = 3            # Stabilize mode
    range   = [1700, 2000]

    [[pilot-cmd.command]]
    channel = 6
    cmd     = 1002         # FMS_Cmd_Disarm
    range   = [1800, 2000]
    type    = 1            # 1:event | 2:status

[actuator]
    [[actuator.devices]]
    freq     = 400
    name     = "main_out"
    protocol = "pwm"

    [[actuator.mappings]]
    chan-map = [[1, 2, 3, 4], [3, 1, 2, 4]]
    from     = "control_out"
    to       = "main_out"

[mavproxy]
    [[mavproxy.devices]]
    baudrate = 57600
    chan     = 0
    name     = "serial5"
    type     = "serial"

    [[mavproxy.devices]]
    auto-switch = true
    chan        = 0
    name        = "usbd0"
    type        = "usb"
